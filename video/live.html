<style>

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: Inter, sans-serif; color: #F6F4EF; }

  .tool .res { margin-left: auto; color: #e2d8cd; }
  .ok { color: #3ccf7a; margin-left: 10px; }
  .ab { font-size: 28px; line-height: 1.45; color: #ece6dd; }
  .ab b { color: #FF7A3D; font-weight: 600; }
  .stamp { position: absolute; left: 50%; top: 50%; padding: 18px 40px; border-radius: 14px; border: 6px solid #FF5A1F; color: #FF5A1F; font-weight: 800; font-size: 96px; letter-spacing: .02em; text-transform: uppercase; background: rgba(20,6,2,.82); box-shadow: 0 0 80px rgba(255,90,31,.55); }
  .tok { display: flex; align-items: center; gap: 22px; padding: 26px 30px; }
  .tok .ic { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 34px; color: #1a0702; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 14px 40px; padding: 0 30px 30px; font-size: 26px; color: #cfc6bb; }
  .kv b { color: #F6F4EF; font-weight: 600; text-align: right; } .kv .bad { color: #ff6a4a; }
  .term pre { padding: 34px 40px; font: 30px/1.75 "JetBrains Mono", monospace; white-space: pre-wrap; }
  .c b { color: #FF5A1F; font-weight: 500; } .e { color: #ff7a5a; } .o { color: #9fd8a8; }
  .caret { display: inline-block; width: 15px; height: 32px; background: #FF5A1F; vertical-align: -5px; }
  .row { display: flex; align-items: center; gap: 18px; padding: 18px 28px; border-top: 1px solid rgba(255,255,255,.06); font-size: 24px; }
  .row .k { color: #a89d92; width: 70px; } .row .tag { width: 120px; font-weight: 600; font-size: 16px; letter-spacing: .14em; color: #FFB36B; }
  .row .anc { margin-left: auto; font-size: 18px; color: #3ccf7a; letter-spacing: .08em; }
  .logos { display: flex; gap: 70px; justify-content: center; align-items: center; }
  .logos div { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; }
  .ca { display: inline-block; padding: 18px 34px; border-radius: 16px; box-shadow: inset 0 0 0 2px rgba(255,90,31,.6), 0 0 60px rgba(255,90,31,.3); font: 500 40px "JetBrains Mono", monospace; color: #FFE0C9; }
</style>

const bg = document.getElementById("bg").getContext("2d"), stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 4);
const inout = (x) => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const back = (x) => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const mark = (c = "#FF5A1F", cls = "") => `<svg class="${cls}" viewBox="0 0 88 88"><path d="${P}" fill="${c}" fill-rule="evenodd"/></svg>`;

        <div style="opacity:${k(0)}"><svg viewBox="0 0 24 24" width="56" height="56"><path d="${CLAUDE}" fill="#D97757"/></svg>Claude</div>
        <div style="opacity:${k(1)}"><svg viewBox="0 0 24 24" width="56" height="56"><path d="${OPENAI}" fill="#F6F4EF"/></svg>ChatGPT</div>
        <div style="opacity:${k(2)}">any MCP client</div></div>
      <div class="line" style="top:620px;opacity:${a}">${words("Open source. github.com/bigrceo/allow", t, 23.0, .12, [2])}</div>`;
  }],
  // 8. Live.
  [25.0, 30.0, (t, a) => {
    const s1 = slam(t, 25.1), k = ease(prog(t, 25.8, 26.4)), g = .6 + .4 * Math.sin(t * 4);
    return `<div style="position:absolute;left:50%;top:150px;width:150px;margin-left:-75px;opacity:${k};filter:drop-shadow(0 0 ${20 + 20 * g}px rgba(255,90,31,.9))">${mark()}</div>
      <div class="line huge" style="top:340px;opacity:${s1.o};transform:scale(${s1.s}) translateX(${s1.shake}px)"><span class="acc">$ALLOW</span> is live</div>
      <div class="line" style="top:560px;opacity:${ease(prog(t, 26.0, 26.6))}">${CA ? `<span class="ca">${CA}</span>` : ""}</div>
      <div class="line" style="top:720px;font-size:44px">${words("Give your agent a wallet. Sealed by your rules.", t, 26.6, .08, [5, 6, 7, 8])}</div>
      <div class="line small" style="top:840px;opacity:${ease(prog(t, 27.6, 28.2))}">useallow.xyz</div>`;
  }],
];


// 0. Cold open: full light, the mark slams out of the depth, a shockwave, candles climbing, the curve filling.
const INTRO = 2.6;
function intro(t) {
  const k = ease(prog(t, 0, .5)), sc = 2.6 - 1.6 * back(prog(t, 0, .55)), rot = -30 + 30 * inout(prog(t, 0, 1.6));
  const layers = [...Array(26)].map((_, i) => `<path d="${P}" fill="${i === 25 ? "url(#face)" : `rgb(${110 + i * 5},${32 + i * 2},${8 + i})`}" fill-rule="evenodd" transform="translate(${i * .5} ${i * .5})"/>`).join("");
  const sweep = 300 * prog(t, .3, 1.3) - 100;
  const rings = [0, .18, .36].map((d) => { const r = prog(t, .25 + d, 1.25 + d); if (!r || r >= 1) return ""; return `<circle cx="960" cy="470" r="${120 + 760 * ease(r)}" fill="none" stroke="#FF8A4C" stroke-width="${6 * (1 - r)}" opacity="${(1 - r) * .8}"/>`; }).join("");
  // candles: deterministic climb, green bodies with orange wicks
  let c = "", y = 900;
  for (let i = 0; i < 34; i++) {
    const at = .15 + i * .045, kk = ease(prog(t, at, at + .25)); if (!kk) continue;
    const up = (i * 37 % 11) > 2, h = 18 + (i * 53 % 40), x = 120 + i * 50;
    const top = up ? y - h : y, bot = up ? y : y + h * .5; y = up ? y - h * .55 : y + h * .25;
    c += `<line x1="${x}" y1="${top - 14}" x2="${x}" y2="${bot + 10}" stroke="${up ? "#3ccf7a" : "#ff6a4a"}" stroke-width="2" opacity="${kk * .7}"/><rect x="${x - 12}" y="${up ? bot - (bot - top) * kk : top}" width="24" height="${(bot - top) * kk}" rx="3" fill="${up ? "#3ccf7a" : "#ff6a4a"}" opacity="${.85 * kk}"/>`;
  }
  const curve = ease(prog(t, .4, 2.3));
  return `<svg width="1920" height="1080" style="position:absolute;inset:0"><defs><linearGradient id="cv" x1="0" x2="1"><stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#3ccf7a"/></linearGradient></defs>
      <g opacity="${.55 * k}">${c}</g>${rings}
      <rect x="560" y="930" width="800" height="14" rx="7" fill="rgba(255,255,255,.08)"/><rect x="560" y="930" width="${800 * curve}" height="14" rx="7" fill="url(#cv)"/>
      <text x="560" y="910" font-size="18" letter-spacing="5" fill="rgba(255,226,206,.75)">BONDING CURVE</text><text x="1360" y="910" text-anchor="end" font-size="18" letter-spacing="3" fill="#3ccf7a">${Math.round(curve * 100)}%</text></svg>
    <div style="position:absolute;left:50%;top:470px;width:520px;height:520px;margin:-260px 0 0 -260px;opacity:${k};transform:rotateY(${rot}deg) scale(${sc});filter:drop-shadow(0 0 ${60 + 40 * Math.sin(t * 6)}px rgba(255,90,31,.85))">
      <svg viewBox="-6 -6 104 104" width="520" height="520"><defs><linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset=".45" stop-color="#FF8A4C"/><stop offset="1" stop-color="#E4420E"/></linearGradient>
      <linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="${sweep}" y1="0" x2="${sweep + 30}" y2="88"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${layers}<path d="${P}" fill="url(#sw)" fill-rule="evenodd" transform="translate(12.5 12.5)"/></svg></div>
    <div class="line small" style="top:110px;opacity:${ease(prog(t, .5, 1))};letter-spacing:.4em">The agent meta · Solana</div>
    <div style="position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center;gap:40px;opacity:${ease(prog(t, .8, 1.3))}">
      <svg viewBox="0 0 24 24" width="40" height="40"><path d="${CLAUDE}" fill="#D97757"/></svg><svg viewBox="0 0 24 24" width="40" height="40"><path d="${OPENAI}" fill="#F6F4EF"/></svg>${mark("#FF5A1F").replace("<svg", '<svg width="40" height="40"')}</div>
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 44%, rgba(255,170,100,${Math.max(0, 1 - t * 3) * .9}), transparent 60%)"></div>`;
}

const introLayer = (T) => `<div style="position:absolute;inset:0;opacity:${1 - ease(prog(T, INTRO - .3, INTRO + .3))};transform:scale(${1 + .15 * ease(prog(T, INTRO - .3, INTRO + .3))})">${intro(T)}</div>`;
window.render = (T) => {
  if (T < INTRO + .3) { drawBg(T, 1.0 - .5 * prog(T, 1.8, INTRO)); stage.innerHTML = introLayer(T); if (T < INTRO) return; }
  const t = T - INTRO;
  const power = t < 2.8 ? .25 + .2 * ease(prog(t, 0, 1)) : t > 25 ? .9 : .32;
  if (T >= INTRO + .3) drawBg(t, power);
  let html = T < INTRO + .3 ? introLayer(T) : ""; for (const [a, b, f] of S) if (t >= a - .01 && t <= b + .4) html += f(t, env(t, a, b + .35));
  stage.innerHTML = html;
};
window.ready = document.fonts.ready;
render(0);
</script>
</body>
</html>
